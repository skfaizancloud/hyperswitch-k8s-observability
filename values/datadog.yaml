# Datadog Agent + Cluster Agent for a small kubeadm cluster (KodeKloud playground)
# site / clusterName are passed by bootstrap.sh with --set
datadog:
  apiKeyExistingSecret: datadog-secret      # key: api-key
  kubelet:
    tlsVerify: false                         # kubeadm kubelet certs don't validate
  logs:
    enabled: true
    containerCollectAll: true
  apm:
    portEnabled: true
  otlp:                                      # receives app traces/metrics from otel-gateway
    receiver:
      protocols:
        grpc:
          enabled: true
          endpoint: "0.0.0.0:4317"
          useHostPort: false                 # Coralogix agent already uses hostPort 4317/4318
        http:
          enabled: true
          endpoint: "0.0.0.0:4318"
          useHostPort: false
  kubeStateMetricsCore:
    enabled: true
  orchestratorExplorer:
    enabled: true
  processAgent:
    enabled: true
    processCollection: false
  networkMonitoring:
    enabled: false
  tags:
    - "project:hyperswitch-demo"

clusterAgent:
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 300m, memory: 300Mi }

agents:
  tolerations:                               # also monitor the control-plane node
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    agent:
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { cpu: 500m, memory: 512Mi }
    traceAgent:
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 300m, memory: 256Mi }
    processAgent:
      resources:
        requests: { cpu: 25m, memory: 64Mi }
        limits: { cpu: 200m, memory: 200Mi }
